name: KJZY combined nightly refresh rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kjzy_*.py'
      - '.github/workflows/kjzy-combined-rehearsal.yml'
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: kjzy-calendar-combined-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview expiration cleanup
        run: python kjzy_expiration_preview.py
      - name: Simulate expiration cleanup on local copy
        run: python kjzy_expiration_preview.py --apply
      - name: Inspect all source websites
        run: python kjzy_all_sources_probe.py
      - name: Diagnose incomplete source extraction
        run: python kjzy_source_diagnostics.py
      - name: Discover priority source event details (read only)
        run: python kjzy_priority_source_discovery.py
      - name: Compare Tourism and Visit Santa Rosa discoveries
        run: python kjzy_priority_candidate_review.py
      - name: Summarize priority-source results
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data=json.loads(Path('kjzy_priority_candidate_review.json').read_text())
          print('## KJZY priority-source discovery (read-only)')
          print('Calendar listings:',data['calendar_listings'])
          print('Discovered records compared:',data['candidates_compared'])
          for key,count in sorted(data['status_counts'].items()):
              print(f'- {key.replace("_", " ")}: {count}')
          print('No event is automatically approved by this review.')
          PY
      - name: Compare candidates
        run: python kjzy_candidate_review.py
      - name: Prepare addition candidates
        run: python kjzy_addition_preview.py
      - name: Verify event detail pages
        run: python kjzy_event_page_verification.py
      - name: Check date-aware duplicates
        run: python kjzy_final_addition_review.py
      - name: Build chronological insertion preview
        run: python kjzy_insertion_preview.py
      - name: Audit original preservation
        run: python kjzy_insertion_audit.py
      - name: Check addition publishing safeguards
        run: python kjzy_addition_publish.py
      - name: Confirm nothing is committed or published
        shell: bash
        run: |
          echo "REHEARSAL ONLY. Changes, if any, remain on the temporary GitHub runner."
          git status --short
      - name: Upload combined reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kjzy-combined-refresh-rehearsal
          path: |
            kjzy_expiration_preview.json
            kjzy_insertion_preview.json
            kjzy_insertion_audit.json
            kjzy_event_page_verification.json
            kjzy_all_sources_report.json
            kjzy_source_diagnostics.json
            kjzy_priority_source_discovery.json
            kjzy_priority_candidate_review.json
          if-no-files-found: warn
          retention-days: 14
