name: KJZY shared collector audit

on:
  push:
    branches: [main]
    paths:
      - 'kjzy_shared_collector.py'
      - 'refresh_summary.json'
      - 'kjzy_priority_sources.txt'
      - '.github/workflows/kjzy-collector-audit.yml'
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kjzy-shared-collector-audit
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidates from eight priority sources
        run: python kjzy_shared_collector.py
      - name: Screen candidate dates and existing calendar links
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import date, datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      url = dict(attrs).get('href', '')
                      if url.startswith(('http://', 'https://')):
                          p = urlsplit(url)
                          self.urls.add((p.netloc.lower().removeprefix('www.'), p.path.rstrip('/').lower()))

          published = Links()
          published.feed(Path('SC_Events.html').read_text(encoding='utf-8'))
          data = json.loads(Path('kjzy_shared_collector_report.json').read_text(encoding='utf-8'))
          today = datetime.now(ZoneInfo('America/Los_Angeles')).date()
          def parse_day(value):
              raw = str(value or '').strip()
              if len(raw) == 8 and raw.isdigit():
                  try:
                      return datetime.strptime(raw, '%Y%m%d').date()
                  except ValueError:
                      return None
              try:
                  return date.fromisoformat(raw[:10])
              except ValueError:
                  return None

          counts = Counter()
          seen = set()
          examples = []
          for source in data['sources']:
              for event in source['events']:
                  title = event.get('title')
                  raw_date = event.get('start_date')
                  url = event.get('event_url')
                  if isinstance(url, dict):
                      url = url.get('@id') or url.get('url')
                  url = url if isinstance(url, str) else ''
                  day = parse_day(raw_date)
                  p = urlsplit(url)
                  identity = (p.netloc.lower().removeprefix('www.'), p.path.rstrip('/').lower(), day)
                  if title and day and p.netloc and identity in seen:
                      status = 'duplicate_candidate_record'
                  elif not title or not url or not p.netloc:
                      status = 'incomplete'
                  elif day is None:
                      status = 'date_needs_review'
                  elif day < today:
                      status = 'expired'
                  elif (p.netloc.lower().removeprefix('www.'), p.path.rstrip('/').lower()) in published.urls:
                      status = 'existing_link_candidate'
                  else:
                      status = 'potential_addition_unverified'
                  if title and day and p.netloc:
                      seen.add(identity)
                  counts[status] += 1
                  examples.append({'source':source['source'],'title':title,'date':raw_date,'url':url,'status':status})
          output = {'read_only':True,'checked_pacific':str(today),'counts':dict(counts),'candidates':examples,
                    'warning':'Potential additions are not verified for title, venue, date, URL reachability or cross-source duplicates.'}
          Path('kjzy_priority_screen_report.json').write_text(json.dumps(output,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('PRIORITY SCREEN:',dict(counts))
          print('READ ONLY; NO EVENTS PUBLISHED')
          PY
      - name: Show collection summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          data = json.load(open('kjzy_shared_collector_report.json'))
          assert data['sources_checked'] == 8, 'Priority source inventory incomplete'
          print('Sources with candidates:', data['sources_with_candidates'])
          print('Unverified event records:', data['total_candidates'])
          print('Source statuses:', dict(Counter(s['status'] for s in data['sources'])))
          PY
      - name: Upload collector results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kjzy-eight-source-collector-audit
          path: |
            kjzy_shared_collector_report.json
            kjzy_priority_screen_report.json
          if-no-files-found: warn
          retention-days: 14
