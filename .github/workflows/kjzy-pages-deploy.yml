name: Publish KJZY calendar to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - KJZY nightly verified event additions
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kjzy-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_second.outputs.page_url || steps.deploy_third.outputs.page_url }}
    steps:
      - name: Checkout latest published calendar
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -s SC_Events.html
          mkdir -p _site
          cp SC_Events.html _site/SC_Events.html
          cp SC_Events.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # The Pages artifact API can briefly report zero artifacts just after upload.
      - name: Allow artifact metadata to become available
        run: sleep 20
      - name: Deploy Pages (first attempt)
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before second attempt
        if: ${{ steps.deploy_first.outcome == 'failure' }}
        run: sleep 30
      - name: Deploy Pages (second attempt)
        id: deploy_second
        if: ${{ steps.deploy_first.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before third attempt
        if: ${{ steps.deploy_first.outcome == 'failure' && steps.deploy_second.outcome == 'failure' }}
        run: sleep 60
      - name: Deploy Pages (third attempt)
        id: deploy_third
        if: ${{ steps.deploy_first.outcome == 'failure' && steps.deploy_second.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Fail if all Pages deployments failed
        if: ${{ steps.deploy_first.outcome == 'failure' && steps.deploy_second.outcome == 'failure' && steps.deploy_third.outcome == 'failure' }}
        run: |
          echo "::error::All three GitHub Pages deployment attempts failed."
          exit 1
