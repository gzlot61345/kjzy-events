name: Publish KJZY calendar to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - KJZY daily expiration cleanup
      - KJZY nightly verified event additions
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kjzy-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest published calendar
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -s SC_Events.html
          mkdir -p _site
          cp SC_Events.html _site/SC_Events.html
          cp SC_Events.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
