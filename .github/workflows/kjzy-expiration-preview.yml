name: KJZY daily expiration safety preview

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  expiration-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate expired and unresolved events (read only)
        run: python kjzy_expiration_preview.py
      - name: Upload expiration review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kjzy-expiration-preview
          path: kjzy_expiration_preview.json
          if-no-files-found: warn
          retention-days: 14
